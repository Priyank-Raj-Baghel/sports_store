<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(t)">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${t}+' | SportsStore'">SportsStore</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>.pic{font-size:4rem;height:140px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d6efd22,#fd7e1444);border-radius:.4rem .4rem 0 0}.brand{font-weight:800;letter-spacing:1px}.card:hover{box-shadow:0 .4rem 1rem #0002}</style>
</head>
<body>
<div th:fragment="nav">
 <nav class="navbar navbar-dark bg-dark"><div class="container">
  <a class="navbar-brand brand" href="/">⚡ SPORTSSTORE</a>
  <div class="d-flex gap-2 align-items-center flex-wrap">
   <a class="btn btn-sm btn-outline-light" href="/cart">Cart <span class="badge bg-warning text-dark" th:text="${cartCount}">0</span></a>
   <a class="btn btn-sm btn-outline-light" href="/orders">Orders</a>
   <a th:if="${me!=null and me.role=='ADMIN'}" class="btn btn-sm btn-warning" href="/admin">Admin</a>
   <span th:if="${me!=null}" class="text-light small">Hi, <b th:text="${me.name}"></b></span>
   <a th:if="${me!=null}" class="btn btn-sm btn-light" href="/logout">Logout</a>
   <a th:if="${me==null}" class="btn btn-sm btn-light" href="/login">Login</a>
   <a th:if="${me==null}" class="btn btn-sm btn-primary" href="/register">Register</a>
  </div></div></nav>
 <div class="container mt-3" th:if="${msg}"><div class="alert alert-info mb-0" th:text="${msg}"></div></div>
</div>
<div th:fragment="card(p)" class="col-6 col-md-4 col-lg-3">
 <a class="card h-100 text-decoration-none text-dark" th:href="@{/product/{id}(id=${p.id})}">
  <div class="pic" th:text="${p.emoji}"></div>
  <div class="card-body"><small class="text-muted" th:text="${p.category+' · '+p.sportType}"></small>
   <h6 class="mt-1" th:text="${p.name}"></h6>
   <b>₹<span th:text="${#numbers.formatDecimal(p.finalPrice(),1,0)}"></span></b>
   <s class="text-muted small" th:if="${p.discount>0}" th:text="${'₹'+#numbers.formatDecimal(p.price,1,0)}"></s>
   <span class="badge bg-danger" th:if="${p.discount>0}" th:text="${p.discount+'% off'}"></span></div></a>
</div>
</body></html>
