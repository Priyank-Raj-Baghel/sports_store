# Default: H2 file database (no install needed). For MySQL run with profile "mysql".
spring.datasource.url=jdbc:h2:file:./data/sportsstore;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
server.port=8080
# Secret used by the test payment gateway to sign payments (HMAC-SHA256)
payment.secret=test_secret_key_change_me
# Razorpay (leave empty to use the local mock gateway). Prefer environment variables over editing this file.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
